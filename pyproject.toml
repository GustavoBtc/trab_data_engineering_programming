
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-engineering-programming"
version = "1.0.0"
description = "Trabalho Final FIAP - Data Engineering Programming"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyspark>=4.0,<5.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0"
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "business*",
    "config*",
    "io_handlers*",
    "pipeline*",
    "spark*"
]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
